name: Share your experience
description: Tell us which character moments felt sweet, funny or awkward.
title: '[Experience] '
body:
  - type: input
    id: setup
    attributes:
      label: Relationship, temperament and CLI
      placeholder: female-friend / blunt / Claude Code
  - type: textarea
    id: moment
    attributes:
      label: What happened?
      description: Use a short fictional conversation. Do not attach private chats, secret keys or your state database.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and how did the character actually respond?
    validations:
      required: true
